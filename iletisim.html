    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 contact-form">
                <h2 class="text-center mb-4">Bana Ulaşın</h2>
                <!-- Form verileri gonder.php veya baska bir yere gitmeyecek, biz JS ile kontrol edecegiz -->
                <form id="contactForm" action="gonderilen.html" method="GET" onsubmit="return validateForm()">
                    <div class="container mt-5" id="app">
    <div class="custom-card shadow-lg p-5">
        <h2 class="text-center mb-4">İletişim Formu</h2>
        <form id="contactForm">
            <div class="mb-3">
                <label class="form-label">Ad Soyad:</label>
                <input type="text" v-model="formData.name" id="name" class="form-control" placeholder="Adınızı yazınız...">
            </div>

            <div class="mb-3">
                <label class="form-label">E-posta:</label>
                <input type="email" v-model="formData.email" id="email" class="form-control" placeholder="isim@ornek.com">
            </div>

            <div class="mb-3">
                <label class="form-label">Telefon:</label>
                <input type="text" v-model="formData.phone" id="phone" class="form-control" placeholder="Sadece rakam giriniz (Örn: 05xx)">
            </div>

            <div class="mb-3">
                <label class="form-label">Konu:</label>
                <select v-model="formData.subject" id="subject" class="form-control">
                    <option value="">Seçiniz...</option>
                    <option value="Öneri">Öneri</option>
                    <option value="Şikayet">Şikayet</option>
                    <option value="Diğer">Diğer</option>
                </select>
            </div>

           <div class="mb-3">
    <label class="form-label d-block text-white">Cinsiyet:</label>
    
    <div class="form-check form-check-inline text-white">
        <input class="form-check-input" type="radio" name="gender" id="genderErkek" v-model="formData.gender" value="Erkek">
        <label class="form-check-label" for="genderErkek" style="cursor: pointer;">Erkek</label>
    </div>
    
    <div class="form-check form-check-inline text-white">
        <input class="form-check-input" type="radio" name="gender" id="genderKadin" v-model="formData.gender" value="Kadın">
        <label class="form-check-label" for="genderKadin" style="cursor: pointer;">Kadın</label>
    </div>
</div>

            <div class="mb-4">
                <label class="form-label">Mesajınız:</label>
                <textarea v-model="formData.message" id="message" class="form-control" rows="4"></textarea>
            </div>

            <div class="d-grid gap-2">
                <button type="button" onclick="checkJS()" class="btn btn-info text-white">Standart JS ile Denetle</button>
                <button type="button" @click="checkVue" class="btn btn-primary">Vue.js ile Denetle & Gönder</button>
                <button type="reset" class="btn btn-outline-light mt-2">Temizle</button>
            </div>
        </form>
    </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="iletisim.js"></script>

                    

                    <div class="mb-3 d-none" id="otherSubjectArea">
                        <label class="form-label">Lütfen Konuyu Belirtin</label>
                        <input type="text" id="otherSubject" name="otherSubject" class="form-control" placeholder="Konu nedir?">
                    </div>
                    
                </form>
            </div>
        </div>
    </div>

    <script>

        document.getElementById('subject').addEventListener('change', function() {
    let otherArea = document.getElementById('otherSubjectArea');
    if (this.value === 'Diğer') {
        otherArea.classList.remove('d-none');
    } else {
        otherArea.classList.add('d-none');
    }
});

        function validateForm() {
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let subject = document.getElementById("subject").value;
            let message = document.getElementById("message").value;

            if (name == "" || email == "" || subject == "" || message == "") {
                alert("Lütfen tüm alanları doldurunuz!");
                return false;
            }

            // E-posta format kontrolü
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                alert("Lütfen geçerli bir e-posta adresi giriniz!");
                return false;
            }

            return true; // Her şey tamamsa gonderilen.html'e gider
        }
    </script>
