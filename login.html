<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #167d7d !important;">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <span class="user-name">Veysel Samed Kaya</span>
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Ana Sayfa</a></li>
                    <li class="nav-item"><a class="nav-link" href="hakkinda.html">Hakkımda</a></li>

                    <li class="nav-item"><a class="nav-link active-link" href="login.html">Giriş</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-auto">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="custom-card p-5 shadow-lg border border-dark border-2">
                    <h3 class="text-center mb-4 fw-bold border-bottom border-dark pb-2">Öğrenci Girişi</h3>
                    <form action="login.php" method="POST">
                        <div class="mb-4">
                            <label class="form-label fw-bold">E-posta</label>
                            <input type="text" name="email" class="form-control border-dark" placeholder="b211210001@sakarya.edu.tr" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Şifre</label>
                            <input type="password" name="password" class="form-control border-dark" placeholder="Şifreniz (Öğrenci No)" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100 py-2 fw-bold shadow">Sisteme Giriş Yap</button>
                    </form>
                    
                    <div id="errorBox" class="alert alert-danger mt-3 text-center fw-bold" style="display:none; background-color: #ffcccc; color: red;">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-auto py-4 text-center" style="background-color: #167d7d;">
        <div class="container">
            <p class="mb-1 fw-bold">Veysel Samed Kaya | Sakarya Üniversitesi</p>
        </div>
    </footer>

    <script>
    // Sayfa tamamen yüklendiğinde çalışır
    document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('durum') === 'hata') {
            const errorBox = document.getElementById("errorBox");
            if (errorBox) {
                errorBox.style.display = "block";
                errorBox.innerText = "Hatalı Giriş! E-posta veya Şifre Yanlış.";
            }
        }
    });
</script>
