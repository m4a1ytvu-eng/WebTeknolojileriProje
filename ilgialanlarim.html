    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100" style="background-color: #d1f2eb;">

    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #167d7d !important;">
        <div class="container">
            <a class="navbar-brand" href="index.html">Veysel Samed Kaya</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Ana Sayfa</a></li>
                    <li class="nav-item"><a class="nav-link" href="hakkinda.html">Hakkımda</a></li>

                    <li class="nav-item"><a class="nav-link" href="login.html">Giriş</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h2 class="text-center mb-5 fw-bold border-bottom border-dark pb-3">Sevdiğim Oyunlar</h2>
        
        <div id="game-container" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
            <div class="text-center w-100 py-5" id="loading-area">
                <div class="spinner-border text-dark" role="status"></div>
                <p class="mt-2 fw-bold">Oyun Verileri Çekiliyor...</p>
            </div>
        </div>
    </main>

    <footer class="mt-auto py-4 text-center" style="background-color: #167d7d; color: white;">
        <p class="mb-0 fw-bold">Veysel Samed Kaya | Sakarya Üniversitesi</p>
    </footer>

    <script>
async function oyunlariGetir() {

    const container = document.getElementById('game-container');

    const apiKey = '9e5d613c01c54c45b3e39331571940ec';

    const oyunlar = [
        "Valorant",
        "Counter-Strike 2",
        "Red Dead Redemption 2",
        "Football Manager 2024",
        "PUBG",
        "eFootball 2024",
        "Euro Truck Simulator 2",
        "Sniper Elite 4"
    ];

    container.innerHTML = "";

    for (const oyun of oyunlar) {

        try {

            const response = await fetch(
                `https://api.rawg.io/api/games?key=${apiKey}&search=${encodeURIComponent(oyun)}&page_size=1`
            );

            if (!response.ok) {
                throw new Error("API isteği başarısız");
            }

            const data = await response.json();
            console.log(data);

            if (data.results && data.results.length > 0) {

                const game = data.results[0];

                container.innerHTML += `
                    <div class="col">
                        <div class="card h-100 shadow border-dark"
                             style="border-radius:15px; overflow:hidden;">

                            <img 
                                src="${game.background_image || 'https://via.placeholder.com/300x200'}"
                                class="card-img-top"
                                style="height:180px; object-fit:cover;"
                            >

                            <div class="card-body">

                                <h5 class="card-title fw-bold">
                                    ${game.name}
                                </h5>

                                <p class="mb-2">
                                    ⭐ ${game.rating}/5
                                </p>

                                <p class="text-muted">
                                    Çıkış: ${game.released || "Bilinmiyor"}
                                </p>

                                <a 
                                    href="https://rawg.io/games/${game.slug}"
                                    target="_blank"
                                    class="btn btn-dark w-100"
                                >
                                    İncele
                                </a>

                            </div>
                        </div>
                    </div>
                `;
            }

        } catch (error) {

            console.log("Hata:", error);

            container.innerHTML += `
                <div class="col">
                    <div class="alert alert-danger">
                        ${oyun} verisi alınamadı.
                    </div>
                </div>
            `;
        }
    }
}

oyunlariGetir();
</script>
</body>
</html>
