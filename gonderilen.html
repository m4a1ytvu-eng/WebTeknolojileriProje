<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Mesaj Alındı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5 text-center">
    <div class="container bg-white p-5 rounded shadow">
        <h1 class="text-success">Mesajınız İletildi!</h1>
        <p>Gönderdiğiniz bilgiler aşağıdadır:</p>
        <div id="result" class="text-start border p-3 bg-light"></div>
        <a href="index.html" class="btn btn-primary mt-4">Ana Sayfaya Dön</a>
    </div>

    <script>
        // URL'deki verileri çekip ekrana basan küçük bir JS
        const params = new URLSearchParams(window.location.search);
        let resultDiv = document.getElementById("result");
        resultDiv.innerHTML = `
            <p><strong>Ad Soyad:</strong> ${params.get('name')}</p>
            <p><strong>E-posta:</strong> ${params.get('email')}</p>
            <p><strong>Konu:</strong> ${params.get('subject')}</p>
            <p><strong>Mesaj:</strong> ${params.get('message')}</p>
        `;
    </script>
</body>
</html>
